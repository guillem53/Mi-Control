<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d141e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Control">
<link rel="manifest" href="manifest.webmanifest">
<title>Mi Control — Finanzas estilo MyInvestor</title>

<style>
:root {
  --bg: #090e15;
  --panel: #121b27;
  --panel-card: #182434;
  --text: #f0f4f8;
  --muted: #8fa0b5;
  --line: #223246;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --green: #10b981;
  --red: #ef4444;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  padding-bottom: 90px;
}

header {
  padding: calc(18px + env(safe-area-inset-top)) 20px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.header-badge { font-size: 11px; background: #1e2d42; padding: 4px 10px; border-radius: 20px; color: var(--muted); }

main { max-width: 600px; margin: auto; padding: 16px; }

/* Tarjeta Principal MyInvestor */
.balance-card {
  background: linear-gradient(145deg, #162335, #0f1926);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
.balance { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 8px 0 4px; color: #ffffff; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stat-val { font-size: 18px; font-weight: 700; margin-top: 4px; }

/* Panel de Entrada Rápida (Sustituto de Widgets) */
.quick-panel {
  background: var(--panel-card);
  border: 1px solid var(--accent);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
}
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }

/* Tablas y Listas */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row-title { font-weight: 600; font-size: 14px; }
.row-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
.amount { font-weight: 700; font-size: 14px; }
.positive { color: var(--green); }
.negative { color: var(--red); }

/* Botones e Inputs */
button {
  border: 0; border-radius: 10px; padding: 12px 14px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
  transition: opacity 0.2s;
}
button:active { opacity: 0.8; }
button.secondary { background: var(--panel-card); color: var(--text); border: 1px solid var(--line); }
button.small { padding: 8px 12px; font-size: 11px; }

input, select {
  width: 100%; padding: 12px; margin: 6px 0 12px;
  border-radius: 10px; border: 1px solid var(--line);
  background: #090e15; color: var(--text); font: inherit;
}
label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }

/* Navegación Inferior */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-around;
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  background: rgba(18, 27, 39, 0.95); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
nav button {
  background: none; color: var(--muted); padding: 4px 8px;
  display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 10px;
}
nav button span { font-size: 18px; }
nav button.active { color: var(--accent-light); }
.hidden { display: none !important; }
</style>
</head>

<body>
<header>
  <div class="logo">MY<span>CONTROL</span></div>
  <div class="header-badge" id="monthDisplay">--</div>
</header>

<main>
<section id="home">
  <!-- Tarjeta Estilo MyInvestor -->
  <div class="balance-card">
    <div class="eyebrow">Disponible Estimado</div>
    <div class="balance" id="available">0,00 €</div>
    <div style="color:var(--muted); font-size:12px;">Posición global tras ahorro y fijos</div>
  </div>

  <!-- Operaciones Rápidas (Estilo App Nativa) -->
  <div class="quick-panel">
    <div class="eyebrow" style="color:var(--accent-light);">⚡️ Registro Rápido</div>
    <div class="quick-grid">
      <button class="secondary small" onclick="quickAdd('Café', 1.50, 'Restaurantes')">☕️ Café 1,50 €</button>
      <button class="secondary small" onclick="quickAdd('Supermercado', 15.00, 'Supermercado')">🛒 Super 15 €</button>
      <button class="secondary small" onclick="quickAdd('Dacia', 20.00, 'Gasolina Dacia')">⛽️ Dacia 20 €</button>
      <button class="secondary small" onclick="quickAdd('Honda', 10.00, 'Gasolina Honda')">🏍 Honda 10 €</button>
    </div>
  </div>

  <div class="grid">
    <div class="stat"><div class="eyebrow">Ingresos</div><div class="stat-val positive" id="income">0 €</div></div>
    <div class="stat"><div class="eyebrow">Gastos</div><div class="stat-val negative" id="spent">0 €</div></div>
  </div>

  <h2>Presupuestos del Mes</h2>
  <div class="card" id="budgetSummary"></div>

  <h2>Últimos Movimientos</h2>
  <div class="card" id="recent"></div>
</section>

<section id="movements" class="hidden">
  <h2>Movimientos</h2>
  <div class="card" id="transactions"></div>

  <form id="transactionForm" class="card">
    <h3>Añadir Operación</h3>
    <label>Concepto</label>
    <input id="concept" placeholder="Ej. Compra" required>
    
    <label>Importe (€)</label>
    <input id="amount" type="number" min="0.01" step="0.01" required>

    <label>Fecha</label>
    <input id="date" type="date" required>

    <label>Tipo</label>
    <select id="type">
      <option value="expense">Gasto</option>
      <option value="income">Ingreso</option>
    </select>

    <label>Categoría</label>
    <select id="category">
      <option>Supermercado</option>
      <option>Restaurantes</option>
      <option>Gasolina Dacia</option>
      <option>Gasolina Honda</option>
      <option>Transporte</option>
      <option>Gatos</option>
      <option>Ocio</option>
      <option>Compras</option>
      <option>Otros</option>
    </select>

    <button type="submit" style="width:100%">Guardar Movimiento</button>
  </form>
</section>
</main>

<nav>
  <button class="active" onclick="showTab('home')"><span>📊</span>Inicio</button>
  <button onclick="showTab('movements')"><span>💳</span>Movimientos</button>
</nav>

<script>
const KEY = "mi-control-finanzas-v1";

const initialData = {
  income: 1900, saving: 300,
  fixed: [{name:"Vivienda",amount:425}, {name:"Electricidad",amount:45}],
  budgets: [
    {name:"Alimentación",category:"Supermercado",amount:260},
    {name:"Gasolina Dacia",category:"Gasolina Dacia",amount:181}
  ],
  transactions:[]
};

let data = JSON.parse(localStorage.getItem(KEY)) || initialData;
const money = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today = () => new Date().toISOString().split('T')[0];

function save() { localStorage.setItem(KEY, JSON.stringify(data)); render(); }

function quickAdd(concept, amount, category) {
  data.transactions.push({
    id: Date.now().toString(), name: concept, amount: Number(amount),
    date: today(), type: "expense", category: category
  });
  save();
}

function showTab(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

function render() {
  const spent = data.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const income = data.income;
  const available = income - spent - data.saving;

  document.getElementById("monthDisplay").textContent = new Date().toLocaleDateString("es-ES",{month:"short",year:"numeric"});
  document.getElementById("available").textContent = money(available);
  document.getElementById("income").textContent = money(income);
  document.getElementById("spent").textContent = money(spent);

  const txs = [...data.transactions].reverse();
  document.getElementById("recent").innerHTML = txs.slice(0,5).map(t => `
    <div class="row">
      <div><div class="row-title">${t.name}</div><div class="row-sub">${t.category}</div></div>
      <div class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}${money(t.amount)}</div>
    </div>
  `).join("") || '<div style="color:var(--muted);font-size:12px;">Sin movimientos registrados.</div>';
}

document.getElementById("transactionForm").addEventListener("submit", e => {
  e.preventDefault();
  quickAdd(
    document.getElementById("concept").value,
    document.getElementById("amount").value,
    document.getElementById("category").value
  );
  e.target.reset();
  showTab("home");
});

render();
</script>
</body>
</html>
