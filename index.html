<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Control">
<title>Mi Control</title>

<style>
:root {
  --bg: #0b0f1d;
  --panel: #131a2e;
  --panel-card: #18223c;
  --text: #f0f4f8;
  --muted: #8fa0b5;
  --line: #202b47;
  --accent: #00d1ff;
  --green: #10b981;
  --red: #ef4444;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  padding-bottom: 40px;
}

header {
  padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
  background: linear-gradient(180deg, #131a2e, #0b0f1d);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.header-badge { font-size: 11px; background: rgba(0,209,255,0.1); border: 1px solid rgba(0,209,255,0.3); padding: 4px 10px; border-radius: 20px; color: var(--accent); font-weight: 700; text-transform: capitalize;}

main { max-width: 600px; margin: auto; padding: 16px; }

/* ESTIL WIDGET PRINCIPAL */
.widget-card {
  background: linear-gradient(145deg, #162340, #0e1628);
  border: 1px solid #25355a;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}

.widget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.ring-container {
  position: relative;
  width: 110px;
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ring-container svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}

.ring-bg {
  stroke: #1b2847;
  stroke-width: 8;
  fill: none;
}

.ring-progress {
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  fill: none;
  stroke-dasharray: 283;
  stroke-dashoffset: 283;
  transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
}

.ring-text {
  position: absolute;
  text-align: center;
}
.ring-percent { font-size: 18px; font-weight: 800; color: #fff; }
.ring-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; }

.widget-info {
  flex: 1;
  margin-left: 16px;
}
.eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
.balance { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin: 4px 0; color: #ffffff; }

/* FORMULARI DEL WIDGET */
.widget-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.widget-form input, .widget-form select {
  margin: 0;
  padding: 10px 12px;
  font-size: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #080c18;
  color: var(--text);
}
.widget-form button {
  grid-column: span 2;
  padding: 11px;
  font-size: 13px;
  border-radius: 10px;
  margin-top: 4px;
  background: var(--accent);
  color: #0b0f1d;
  font-weight: 800;
  border: 0;
  cursor: pointer;
}

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row-title { font-weight: 700; font-size: 14px; }
.row-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
.amount { font-weight: 800; font-size: 14px; }
.positive { color: var(--green); }
.negative { color: var(--red); }

h2 { font-size: 15px; margin: 18px 2px 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
</style>
</head>

<body>
<header>
  <div class="logo">◈ MI <span>CONTROL</span></div>
  <div class="header-badge" id="monthDisplay">--</div>
</header>

<main>
  <!-- WIDGET PRINCIPAL AMB ANELL I REGISTRE -->
  <div class="widget-card">
    <div class="widget-header">
      <div class="ring-container">
        <svg viewBox="0 0 100 100">
          <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
          <circle class="ring-progress" id="ringCircle" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="ring-text">
          <div class="ring-percent" id="ringPercent">0%</div>
          <div class="ring-label">Usat</div>
        </div>
      </div>
      <div class="widget-info">
        <div class="eyebrow">Disponible Estimat</div>
        <div class="balance" id="available">0,00 €</div>
        <div style="color:var(--muted); font-size:11px;" id="subText">0 € de 0 € compromesos</div>
      </div>
    </div>

    <!-- REGISTRE DE DESPESES I INGRESOS (WIDGET) -->
    <form id="widgetQuickForm" class="widget-form">
      <input type="number" id="wAmount" step="0.01" min="0.01" placeholder="Quantitat (€)" required>
      <select id="wType">
        <option value="expense">Despesa (−)</option>
        <option value="income">Ingrés (+)</option>
      </select>
      <input type="text" id="wConcept" placeholder="Concepte (ex. Cafè)" required>
      <select id="wCategory">
        <option>Supermercat</option>
        <option>Restaurants</option>
        <option>Gasolina Dacia</option>
        <option>Gasolina Honda</option>
        <option>Gats</option>
        <option>Oci</option>
        <option>Nomina</option>
        <option>Altres</option>
      </select>
      <button type="submit">Afegir Moviment</button>
    </form>
  </div>

  <h2>Últims Moviments</h2>
  <div class="card" id="recent"></div>
</main>

<script>
const KEY = "mi-control-finanzas-v1";

const initialData = {
  income: 1900, saving: 300,
  fixed: [{name:"Habitatge",amount:425}, {name:"Llum",amount:45}],
  transactions:[]
};

let data = JSON.parse(localStorage.getItem(KEY)) || initialData;
const money = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today = () => new Date().toISOString().split('T')[0];

function save() { localStorage.setItem(KEY, JSON.stringify(data)); render(); }

function render() {
  const fixed = data.fixed.reduce((s,x)=>s+Number(x.amount),0);
  const spent = data.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);
  const extraIncome = data.transactions.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount),0);
  
  const totalIncome = Number(data.income) + extraIncome;
  const available = totalIncome - fixed - spent - Number(data.saving);

  document.getElementById("monthDisplay").textContent = new Date().toLocaleDateString("ca-ES",{month:"short",year:"numeric"});
  document.getElementById("available").textContent = money(available);
  
  const committed = fixed + spent + Number(data.saving);
  const percent = Math.min(100, Math.max(0, Math.round((committed / Math.max(1, totalIncome)) * 100)));
  
  // Anell de progrés SVG
  const circle = document.getElementById("ringCircle");
  const circumference = 2 * Math.PI * 45; // r=45
  const offset = circumference - (percent / 100) * circumference;
  circle.style.strokeDasharray = `${circumference}`;
  circle.style.strokeDashoffset = offset;
  
  if (percent > 90) circle.style.stroke = "var(--red)";
  else circle.style.stroke = "var(--accent)";

  document.getElementById("ringPercent").textContent = percent + "%";
  document.getElementById("subText").textContent = `${money(committed)} de ${money(totalIncome)}`;

  const txs = [...data.transactions].reverse();
  document.getElementById("recent").innerHTML = txs.length ? txs.map(t => `
    <div class="row">
      <div><div class="row-title">${t.name}</div><div class="row-sub">${t.date} · ${t.category}</div></div>
      <div class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div>
    </div>
  `).join("") : '<div style="color:var(--muted);font-size:12px;text-align:center;padding:10px;">Sense moviments registrats.</div>';
}

document.getElementById("widgetQuickForm").addEventListener("submit", e => {
  e.preventDefault();
  data.transactions.push({
    id: Date.now().toString(),
    name: document.getElementById("wConcept").value,
    amount: Number(document.getElementById("wAmount").value),
    date: today(),
    type: document.getElementById("wType").value,
    category: document.getElementById("wCategory").value
  });
  save();
  e.target.reset();
});

render();
</script>
</body>
</html>
