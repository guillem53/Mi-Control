<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Control">
<title>Mi Control</title>

<style>
:root {
  --bg: #0a1210;
  --panel: #111e1a;
  --panel-card: #182823;
  --text: #f0f8f5;
  --muted: #85a399;
  --line: #1f362f;
  --accent: #10b981; /* Verde principal */
  --accent-glow: rgba(16, 185, 129, 0.15);
  --green: #34d399;
  --red: #f87171;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  padding-bottom: 90px;
}

header {
  padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
  background: linear-gradient(180deg, #131a2e, #0b0f1d);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.header-badge { font-size: 11px; background: rgba(0,209,255,0.1); border: 1px solid rgba(0,209,255,0.3); padding: 4px 10px; border-radius: 20px; color: var(--accent); font-weight: 700; text-transform: capitalize;}

main { max-width: 600px; margin: auto; padding: 16px; }

.hero {
  background: linear-gradient(135deg, #182544, #0f172a);
  border: 1px solid #27385f;
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.balance { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; margin: 10px 0 4px; color: #ffffff; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stat-val { font-size: 19px; font-weight: 800; margin-top: 6px; }

.quick-panel {
  background: var(--panel-card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row-title { font-weight: 700; font-size: 14px; }
.row-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.amount { font-weight: 800; font-size: 15px; }
.positive { color: var(--green); }
.negative { color: var(--red); }

.progress { height: 8px; background: #1c2744; border-radius: 20px; overflow: hidden; margin: 10px 0 6px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 20px; transition: width 0.3s ease; }

button {
  border: 0; border-radius: 12px; padding: 12px 14px;
  background: var(--accent); color: #0b0f1d; font-weight: 800; font-size: 13px; cursor: pointer;
}
button.secondary { background: #1c2847; color: var(--text); border: 1px solid var(--line); }
button.small { padding: 9px 12px; font-size: 12px; }

input, select {
  width: 100%; padding: 12px; margin: 6px 0 14px;
  border-radius: 12px; border: 1px solid var(--line);
  background: #080c18; color: var(--text); font: inherit;
}
label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }

h2 { font-size: 16px; margin: 20px 2px 10px; font-weight: 800; letter-spacing: -0.3px; }

nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-around;
  padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
  background: rgba(19, 26, 46, 0.92); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
nav button {
  background: none; color: var(--muted); padding: 4px 8px;
  display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 10px;
}
nav button span { font-size: 20px; }
nav button.active { color: var(--accent); }
.hidden { display: none !important; }
</style>
</head>

<body>
<header>
  <div class="logo">◈ MI <span>CONTROL</span></div>
  <div class="header-badge" id="monthDisplay">--</div>
</header>

<main>
<section id="home">
  <div class="hero">
    <div class="eyebrow" style="color:#00d1ff;">Dinero disponible estimado</div>
    <div class="balance" id="available">0,00 €</div>
    <div style="color:var(--muted); font-size:12px;">Descontando gastos fijos, registrados y ahorro</div>
    <div class="progress"><div class="progress-fill" id="mainProgress"></div></div>
    <div style="color:var(--muted); font-size:11px;" id="progressText"></div>
  </div>

  <div class="quick-panel">
    <div class="eyebrow" style="color:var(--accent);">⚡️ Accesos Rápidos</div>
    <div class="quick-grid">
      <button class="secondary small" onclick="quickAdd('Café', 1.50, 'Restaurantes')">☕️ Café (1.50 €)</button>
      <button class="secondary small" onclick="quickAdd('Supermercado', 15.00, 'Supermercado')">🛒 Super (15 €)</button>
      <button class="secondary small" onclick="quickAdd('Gasolina Dacia', 20.00, 'Gasolina Dacia')">⛽️ Dacia (20 €)</button>
      <button class="secondary small" onclick="quickAdd('Gasolina Honda', 10.00, 'Gasolina Honda')">🏍 Honda (10 €)</button>
    </div>
  </div>

  <div class="grid">
    <div class="stat"><div class="eyebrow">Ingresos</div><div class="stat-val positive" id="income">0 €</div></div>
    <div class="stat"><div class="eyebrow">Gastos</div><div class="stat-val negative" id="spent">0 €</div></div>
    <div class="stat"><div class="eyebrow">Ahorro</div><div class="stat-val" id="saving">0 €</div></div>
    <div class="stat"><div class="eyebrow">Gastos Fijos</div><div class="stat-val" id="fixedTotal">0 €</div></div>
  </div>

  <h2>Presupuestos del mes</h2>
  <div class="card" id="budgetSummary"></div>

  <h2>Últimos movimientos</h2>
  <div class="card" id="recent"></div>
</section>

<section id="movements" class="hidden">
  <h2>Movimientos</h2>
  <div class="card" id="transactions"></div>

  <form id="transactionForm" class="card">
    <h3>Añadir movimiento</h3>
    <label>Concepto</label>
    <input id="concept" placeholder="Ej. Compra" required>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label>Importe (€)</label>
        <input id="amount" type="number" min="0.01" step="0.01" required>
      </div>
      <div>
        <label>Fecha</label>
        <input id="date" type="date" required>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label>Tipo</label>
        <select id="type">
          <option value="expense">Gasto</option>
          <option value="income">Ingreso</option>
        </select>
      </div>
      <div>
        <label>Categoría</label>
        <select id="category">
          <option>Supermercado</option>
          <option>Restaurantes</option>
          <option>Gasolina Dacia</option>
          <option>Gasolina Honda</option>
          <option>Transporte</option>
          <option>Gatos</option>
          <option>Ocio</option>
          <option>Compras</option>
          <option>Otros</option>
        </select>
      </div>
    </div>

    <button type="submit" style="width:100%">Guardar movimiento</button>
  </form>
</section>
</main>

<nav>
  <button class="active" id="nav-home" onclick="showTab('home')"><span>⌂</span>Inicio</button>
  <button id="nav-movements" onclick="showTab('movements')"><span>↕</span>Movimientos</button>
</nav>

<script>
const KEY = "mi-control-finanzas-v1";

const initialData = {
  income: 1900, saving: 300,
  fixed: [{name:"Vivienda",amount:425}, {name:"Electricidad",amount:45}, {name:"Agua",amount:40}],
  budgets: [
    {name:"Alimentación",category:"Supermercado",amount:260},
    {name:"Gasolina Dacia",category:"Gasolina Dacia",amount:181},
    {name:"Gasolina Honda",category:"Gasolina Honda",amount:50}
  ],
  transactions:[]
};

let data = JSON.parse(localStorage.getItem(KEY)) || initialData;
const money = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today = () => new Date().toISOString().split('T')[0];

function save() { localStorage.setItem(KEY, JSON.stringify(data)); render(); }

function quickAdd(concept, amount, category) {
  data.transactions.push({
    id: Date.now().toString(), name: concept, amount: Number(amount),
    date: today(), type: "expense", category: category
  });
  save();
}

function showTab(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("nav-" + id).classList.add("active");
  window.scrollTo(0,0);
}

function render() {
  const fixed = data.fixed.reduce((s,x)=>s+Number(x.amount),0);
  const spent = data.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);
  const income = Number(data.income);
  const available = income - fixed - spent - Number(data.saving);

  document.getElementById("monthDisplay").textContent = new Date().toLocaleDateString("es-ES",{month:"short",year:"numeric"});
  document.getElementById("available").textContent = money(available);
  document.getElementById("income").textContent = money(income);
  document.getElementById("spent").textContent = money(spent);
  document.getElementById("saving").textContent = money(data.saving);
  document.getElementById("fixedTotal").textContent = money(fixed);

  const committed = fixed + spent + Number(data.saving);
  const percent = Math.min(100, Math.max(0, committed / Math.max(1, income) * 100));
  document.getElementById("mainProgress").style.width = percent + "%";
  document.getElementById("progressText").textContent = `${money(committed)} comprometidos de ${money(income)}`;

  document.getElementById("budgetSummary").innerHTML = data.budgets.map(b=>{
    const used = data.transactions.filter(t=>t.type==="expense"&&t.category===b.category).reduce((s,t)=>s+Number(t.amount),0);
    const p = b.amount>0 ? Math.min(100, used/b.amount*100) : 0;
    const remaining = Number(b.amount) - used;
    return `<div class="row">
      <div style="flex:1; margin-right:12px;">
        <div class="row-title">${b.name}</div>
        <div class="progress"><div class="progress-fill" style="width:${p}%;${used>b.amount?"background:var(--red)":""}"></div></div>
        <div class="row-sub">${money(used)} de ${money(b.amount)}</div>
      </div>
      <div class="amount ${remaining<0?"negative":""}">${money(remaining)}</div>
    </div>`;
  }).join("");

  const txs = [...data.transactions].reverse();
  const htmlTxs = txs.length ? txs.map(t => `
    <div class="row">
      <div><div class="row-title">${t.name}</div><div class="row-sub">${t.date} · ${t.category}</div></div>
      <div class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div>
    </div>
  `).join("") : '<div style="color:var(--muted);font-size:12px;text-align:center;padding:10px;">Sin movimientos.</div>';

  document.getElementById("recent").innerHTML = txs.slice(0,5).map(t => `
    <div class="row">
      <div><div class="row-title">${t.name}</div><div class="row-sub">${t.category}</div></div>
      <div class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div>
    </div>
  `).join("") || '<div style="color:var(--muted);font-size:12px;text-align:center;padding:10px;">Sin movimientos.</div>';

  document.getElementById("transactions").innerHTML = htmlTxs;
  document.getElementById("date").value = today();
}

document.getElementById("transactionForm").addEventListener("submit", e => {
  e.preventDefault();
  quickAdd(
    document.getElementById("concept").value,
    document.getElementById("amount").value,
    document.getElementById("category").value
  );
  e.target.reset();
  showTab("home");
});

render();
</script>
</body>
</html>
